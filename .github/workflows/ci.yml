name: CI - Logistica Global

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep
      - run: semgrep scan --config semgrep.yml --error --metrics=off inventario.py

  deploy-staging:
    name: deploy-staging
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Despliegue de laboratorio en staging
        run: |
          mkdir -p /tmp/staging
          cp inventario.py requirements.txt test_*.py /tmp/staging/
          cd /tmp/staging
          python -m pip install -r requirements.txt
          python -m pytest -v
          echo "Validacion de staging exitosa"
          echo "Version: $GITHUB_SHA"

  deploy-production:
    name: deploy-production
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Despliegue de laboratorio en produccion
        run: |
          mkdir -p /tmp/production
          cp inventario.py requirements.txt test_*.py /tmp/production/
          cd /tmp/production
          python -m pip install -r requirements.txt
          python -m pytest -v
          echo "Despliegue de laboratorio autorizado"
          echo "Version: $GITHUB_SHA"
